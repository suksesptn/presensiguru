<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Guru - Sukses PTN Al Bayan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#059669',
                        primaryDark: '#047857',
                        background: '#F8FAFC',
                    }
                }
            }
        }
    </script>
    <style>
        .checkbox-custom:checked + div {
            background-color: #059669;
            border-color: #059669;
            color: white;
        }
        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-background text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="https://suksesptn.github.io" class="text-slate-400 hover:text-primary transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </a>
                <div class="flex items-center gap-3">
                    <div class="bg-primary text-white p-2 rounded-lg">
                        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900">Presensi Guru</h1>
                        <p class="text-xs text-slate-500">Program Sukses PTN Al Bayan</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full">
        
        <form id="presensiForm" class="space-y-6">
            
            <!-- Card 1: Informasi Dasar -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">
                <div class="flex items-center gap-2 mb-5">
                    <i data-lucide="file-text" class="w-5 h-5 text-primary"></i>
                    <h2 class="text-lg font-semibold text-slate-900">Informasi Presensi</h2>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- Jenis Presensi -->
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Jenis Presensi <span class="text-rose-500">*</span>
                        </label>
                        <select id="jenis" name="jenis" required 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none transition-all bg-slate-50 font-medium">
                            <option value="" disabled selected>Pilih Jenis Presensi...</option>
                            <option value="TKA">Intensif TKA</option>
                            <option value="SNBT">Intensif SNBT</option>
                            <option value="IUP">Intensif IUP</option>
                            <option value="Ujian Mandiri">Intensif Ujian Mandiri</option>
                            <option value="Tambahan Sore">Tambahan Sore</option>
                            <option value="KBM Online">KBM Online</option>
                            <option value="Petugas KBM Online">Petugas KBM Online</option>
                            <option value="Pengawas Tryout">Pengawas Tryout</option>
                        </select>
                    </div>

                    <!-- Tanggal -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Tanggal <span class="text-rose-500">*</span>
                        </label>
                        <input type="date" id="tanggal" name="tanggal" required 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none transition-all bg-slate-50">
                    </div>

                    <!-- Mata Pelajaran -->
                    <div id="mapelContainer" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Mata Pelajaran <span class="text-rose-500">*</span>
                        </label>
                        <select id="mapel" name="mapel" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none transition-all bg-slate-50">
                            <option value="" disabled selected>Pilih Mapel...</option>
                        </select>
                        <div id="mapelLoading" class="hidden mt-2">
                            <div class="h-12 rounded-lg loading-skeleton"></div>
                        </div>
                    </div>

                    <!-- Nama Guru -->
                    <div id="guruContainer" class="hidden sm:col-span-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Nama Guru <span class="text-rose-500">*</span>
                        </label>
                        <select id="guru" name="guru" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none transition-all bg-slate-50">
                            <option value="" disabled selected>Pilih Mata Pelajaran terlebih dahulu</option>
                        </select>
                        <div id="guruLoading" class="hidden mt-2">
                            <div class="h-12 rounded-lg loading-skeleton"></div>
                        </div>
                    </div>

                    <!-- Kelas -->
                    <div id="kelasContainer" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Kelas <span class="text-rose-500">*</span>
                        </label>
                        <select id="kelas" name="kelas" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none transition-all bg-slate-50">
                            <option value="" disabled selected>Pilih Kelas...</option>
                        </select>
                        <div id="kelasLoading" class="hidden mt-2">
                            <div class="h-12 rounded-lg loading-skeleton"></div>
                        </div>
                    </div>

                    <!-- Jumlah JP -->
                    <div id="jpContainer" class="hidden">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            Jumlah JP <span class="text-rose-500">*</span>
                        </label>
                        <input type="number" id="jp" name="jp" value="2" min="1" max="10"
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none transition-all bg-slate-50">
                    </div>
                </div>
            </div>

            <!-- Card 2: Daftar Kehadiran Siswa -->
            <div id="kehadiranContainer" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">
                <div class="flex items-center justify-between mb-5">
                    <div class="flex items-center gap-2">
                        <i data-lucide="users" class="w-5 h-5 text-primary"></i>
                        <h2 class="text-lg font-semibold text-slate-900">Daftar Kehadiran Siswa</h2>
                    </div>
                    <div class="text-sm text-slate-500">
                        <span id="totalSiswa">0</span> siswa terdaftar
                    </div>
                </div>

                <!-- Search Siswa -->
                <div class="mb-4">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                        <input type="text" id="searchSiswa" placeholder="Cari nama siswa..." 
                            class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none transition-all">
                    </div>
                </div>

                <!-- Checkbox List Siswa -->
                <div id="siswaList" class="space-y-2 max-h-96 overflow-y-auto p-2 border border-slate-100 rounded-xl bg-slate-50">
                    <p class="text-center text-slate-400 py-8">Pilih kelas untuk menampilkan daftar siswa</p>
                </div>

                <!-- Tambah Siswa Manual -->
                <div class="mt-5 pt-5 border-t border-slate-100">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        <i data-lucide="user-plus" class="w-4 h-4 inline mr-1"></i>
                        Tambah Siswa Manual (pisahkan dengan koma jika lebih dari 1)
                    </label>
                    <textarea id="siswaManual" name="siswaManual" rows="2" 
                        placeholder="Contoh: Ahmad Fauzi, Budi Santoso"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none transition-all bg-slate-50 resize-none text-sm"></textarea>
                    <p class="text-xs text-slate-500 mt-1">* Siswa yang ditambahkan manual akan otomatis dianggap hadir</p>
                </div>

                <!-- Statistik -->
                <div class="mt-5 grid grid-cols-2 gap-3">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-emerald-600" id="statHadir">0</div>
                        <div class="text-xs text-emerald-700 font-medium">Siswa Hadir</div>
                    </div>
                    <div class="bg-rose-50 border border-rose-200 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-rose-600" id="statTidakHadir">0</div>
                        <div class="text-xs text-rose-700 font-medium">Siswa Tidak Hadir</div>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="flex flex-col sm:flex-row gap-3">
                <button type="button" id="resetBtn" 
                    class="flex-1 px-6 py-4 border-2 border-slate-200 text-slate-600 font-semibold rounded-xl hover:bg-slate-50 transition-all">
                    <i data-lucide="rotate-ccw" class="w-5 h-5 inline mr-2"></i>
                    Reset Form
                </button>
                <button type="submit" id="submitBtn" 
                    class="flex-[2] bg-primary hover:bg-primaryDark text-white font-semibold py-4 px-6 rounded-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="save" class="w-5 h-5"></i>
                    <span>Simpan Presensi</span>
                </button>
            </div>
        </form>
    </main>

    <!-- Notification -->
    <div id="notification" class="fixed bottom-4 right-4 left-4 sm:left-auto sm:w-96 hidden z-50">
        <div class="bg-white rounded-xl shadow-2xl border-l-4 p-4 flex items-start gap-3">
            <div id="notifIcon"></div>
            <div class="flex-1">
                <h4 id="notifTitle" class="font-semibold text-sm mb-1"></h4>
                <p id="notifMessage" class="text-sm text-slate-600"></p>
            </div>
            <button onclick="closeNotification()" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // Set tanggal hari ini
        document.getElementById('tanggal').valueAsDate = new Date();

        // State management
        let currentData = {
            guru: [],
            siswa: [],
            kelas: [],
            mapel: []
        };

        // Event Listeners
        document.getElementById('jenis').addEventListener('change', handleJenisChange);
        document.getElementById('mapel').addEventListener('change', handleMapelChange);
        document.getElementById('kelas').addEventListener('change', handleKelasChange);
        document.getElementById('searchSiswa').addEventListener('input', handleSearchSiswa);
        document.getElementById('presensiForm').addEventListener('submit', handleSubmit);
        document.getElementById('resetBtn').addEventListener('click', handleReset);

        async function handleJenisChange() {
            const jenis = this.value;
            
            // Hide all dependent fields
            document.getElementById('mapelContainer').classList.add('hidden');
            document.getElementById('guruContainer').classList.add('hidden');
            document.getElementById('kelasContainer').classList.add('hidden');
            document.getElementById('jpContainer').classList.add('hidden');
            document.getElementById('kehadiranContainer').classList.add('hidden');
            
            // Reset values
            document.getElementById('mapel').innerHTML = '<option value="" disabled selected>Pilih Mapel...</option>';
            document.getElementById('guru').innerHTML = '<option value="" disabled selected>Pilih Mata Pelajaran terlebih dahulu</option>';
            document.getElementById('kelas').innerHTML = '<option value="" disabled selected>Pilih Kelas...</option>';
            
            // Load data based on jenis
            if (jenis && ['TKA', 'SNBT', 'IUP', 'Ujian Mandiri'].includes(jenis)) {
                showLoading('mapelLoading');
                try {
                    const data = await google.script.run.withSuccessHandler(onDataLoaded).getDataPresensi(jenis);
                    if (data.error) {
                        showNotification('error', 'Error', data.error);
                    } else {
                        currentData = data;
                        populateMapel(data.mapel);
                        document.getElementById('mapelContainer').classList.remove('hidden');
                    }
                } catch (error) {
                    showNotification('error', 'Error', 'Gagal memuat data');
                } finally {
                    hideLoading('mapelLoading');
                }
            } else {
                // For non-intensif types, show simpler form
                document.getElementById('guruContainer').classList.remove('hidden');
                document.getElementById('jpContainer').classList.remove('hidden');
            }
        }

        function onDataLoaded(data) {
            currentData = data;
            populateMapel(data.mapel);
            populateKelas(data.kelas);
            currentData.siswa = data.siswa;
            currentData.guru = data.guru;
        }

        function populateMapel(mapelList) {
            const select = document.getElementById('mapel');
            select.innerHTML = '<option value="" disabled selected>Pilih Mapel...</option>';
            mapelList.forEach(mapel => {
                const option = document.createElement('option');
                option.value = mapel;
                option.textContent = mapel;
                select.appendChild(option);
            });
        }

        function populateKelas(kelasList) {
            const select = document.getElementById('kelas');
            select.innerHTML = '<option value="" disabled selected>Pilih Kelas...</option>';
            kelasList.forEach(kelas => {
                const option = document.createElement('option');
                option.value = kelas;
                option.textContent = kelas;
                select.appendChild(option);
            });
        }

        async function handleMapelChange() {
            const jenis = document.getElementById('jenis').value;
            const mapel = this.value;
            
            document.getElementById('guruContainer').classList.add('hidden');
            
            if (mapel) {
                showLoading('guruLoading');
                try {
                    const guruList = await google.script.run.withSuccessHandler((gurus) => {
                        const select = document.getElementById('guru');
                        select.innerHTML = '<option value="" disabled selected>Pilih Guru...</option>';
                        gurus.forEach(guru => {
                            const option = document.createElement('option');
                            option.value = guru;
                            option.textContent = guru;
                            select.appendChild(option);
                        });
                        document.getElementById('guruContainer').classList.remove('hidden');
                        document.getElementById('kelasContainer').classList.remove('hidden');
                        document.getElementById('jpContainer').classList.remove('hidden');
                    }).getGuruByMapel(jenis, mapel);
                } catch (error) {
                    showNotification('error', 'Error', 'Gagal memuat data guru');
                } finally {
                    hideLoading('guruLoading');
                }
            }
        }

        async function handleKelasChange() {
            const jenis = document.getElementById('jenis').value;
            const kelas = this.value;
            
            if (kelas) {
                showLoading('siswaList');
                try {
                    const siswaList = await google.script.run.withSuccessHandler((siswas) => {
                        renderSiswaList(siswas);
                        document.getElementById('kehadiranContainer').classList.remove('hidden');
                        updateStatistik();
                    }).getSiswaByKelas(jenis, kelas);
                } catch (error) {
                    showNotification('error', 'Error', 'Gagal memuat data siswa');
                }
            }
        }

        function renderSiswaList(siswaList) {
            const container = document.getElementById('siswaList');
            container.innerHTML = '';
            
            if (siswaList.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-8">Tidak ada siswa di kelas ini</p>';
                document.getElementById('totalSiswa').textContent = '0';
                return;
            }
            
            document.getElementById('totalSiswa').textContent = siswaList.length;
            
            siswaList.forEach((siswa, index) => {
                const div = document.createElement('div');
                div.className = 'siswa-item flex items-center gap-3 p-3 bg-white rounded-lg border border-slate-200 hover:border-primary transition-colors cursor-pointer';
                div.innerHTML = `
                    <label class="flex items-center gap-3 flex-1 cursor-pointer">
                        <input type="checkbox" name="siswaHadir" value="${siswa}" 
                            class="checkbox-custom sr-only" 
                            onchange="updateStatistik()"
                            id="siswa_${index}">
                        <div class="w-5 h-5 border-2 border-slate-300 rounded flex items-center justify-center transition-all checkbox-wrapper">
                            <i data-lucide="check" class="w-3.5 h-3.5 opacity-0 transition-opacity check-icon"></i>
                        </div>
                        <span class="font-medium text-slate-700">${siswa}</span>
                    </label>
                `;
                
                // Toggle checkbox when clicking the div
                div.addEventListener('click', (e) => {
                    if (e.target.type !== 'checkbox') {
                        const checkbox = div.querySelector('input[type="checkbox"]');
                        checkbox.checked = !checkbox.checked;
                        updateCheckboxUI(checkbox);
                        updateStatistik();
                    }
                });
                
                // Update UI when checkbox changes
                const checkbox = div.querySelector('input[type="checkbox"]');
                checkbox.addEventListener('change', () => {
                    updateCheckboxUI(checkbox);
                });
                
                container.appendChild(div);
            });
            
            lucide.createIcons();
        }

        function updateCheckboxUI(checkbox) {
            const wrapper = checkbox.parentElement.nextElementSibling || checkbox.parentElement.querySelector('.checkbox-wrapper');
            const icon = wrapper.querySelector('.check-icon');
            
            if (checkbox.checked) {
                wrapper.classList.add('bg-primary', 'border-primary');
                wrapper.classList.remove('border-slate-300');
                icon.classList.remove('opacity-0');
            } else {
                wrapper.classList.remove('bg-primary', 'border-primary');
                wrapper.classList.add('border-slate-300');
                icon.classList.add('opacity-0');
            }
        }

        function handleSearchSiswa() {
            const searchTerm = this.value.toLowerCase();
            const items = document.querySelectorAll('.siswa-item');
            
            items.forEach(item => {
                const nama = item.querySelector('span').textContent.toLowerCase();
                if (nama.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function updateStatistik() {
            const checkboxes = document.querySelectorAll('input[name="siswaHadir"]:checked');
            const totalSiswa = document.querySelectorAll('.siswa-item').length;
            const hadir = checkboxes.length;
            const tidakHadir = totalSiswa - hadir;
            
            document.getElementById('statHadir').textContent = hadir;
            document.getElementById('statTidakHadir').textContent = tidakHadir;
        }

        async function handleSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalBtnContent = submitBtn.innerHTML;
            
            // Validation
            const jenis = document.getElementById('jenis').value;
            if (!jenis) {
                showNotification('error', 'Validasi', 'Pilih jenis presensi');
                return;
            }
            
            // Collect siswa hadir
            const hadirCheckboxes = document.querySelectorAll('input[name="siswaHadir"]:checked');
            const siswaHadir = Array.from(hadirCheckboxes).map(cb => cb.value);
            
            // Collect semua siswa untuk hitung yang tidak hadir
            const semuaSiswaItems = document.querySelectorAll('.siswa-item input[name="siswaHadir"]');
            const semuaSiswa = Array.from(semuaSiswaItems).map(cb => cb.value);
            const siswaTidakHadir = semuaSiswa.filter(s => !siswaHadir.includes(s));
            
            // Get siswa manual
            const siswaManual = document.getElementById('siswaManual').value;
            
            const formData = {
                jenis: jenis,
                tanggal: document.getElementById('tanggal').value,
                mapel: document.getElementById('mapel').value || '',
                guru: document.getElementById('guru').value,
                kelas: document.getElementById('kelas').value || '',
                jp: document.getElementById('jp').value,
                siswaHadir: siswaHadir,
                siswaTidakHadir: siswaTidakHadir,
                siswaManual: siswaManual
            };
            
            // Show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Menyimpan...</span>
            `;
            
            try {
                const response = await fetch(https://script.google.com/macros/s/AKfycbydQLyp6LkW3Nvu1kyQ9v_n0FZfi-dAAzsoCCXEzUXZ18sUcYoljAmXxaPR5YTAK41QfQ/exec, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showNotification('success', 'Berhasil!', 
                        `Presensi tersimpan!<br>Hadir: ${result.totalHadir} | Tidak Hadir: ${result.totalTidakHadir}`);
                    handleReset();
                } else {
                    showNotification('error', 'Gagal', result.message);
                }
            } catch (error) {
                showNotification('error', 'Error', 'Terjadi kesalahan saat menyimpan data');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
                lucide.createIcons();
            }
        }

        function handleReset() {
            document.getElementById('presensiForm').reset();
            document.getElementById('tanggal').valueAsDate = new Date();
            document.getElementById('jenis').value = '';
            
            document.getElementById('mapelContainer').classList.add('hidden');
            document.getElementById('guruContainer').classList.add('hidden');
            document.getElementById('kelasContainer').classList.add('hidden');
            document.getElementById('jpContainer').classList.add('hidden');
            document.getElementById('kehadiranContainer').classList.add('hidden');
            
            document.getElementById('siswaList').innerHTML = '<p class="text-center text-slate-400 py-8">Pilih kelas untuk menampilkan daftar siswa</p>';
            document.getElementById('statHadir').textContent = '0';
            document.getElementById('statTidakHadir').textContent = '0';
            document.getElementById('totalSiswa').textContent = '0';
            
            currentData = { guru: [], siswa: [], kelas: [], mapel: [] };
        }

        function showNotification(type, title, message) {
            const notif = document.getElementById('notification');
            const icon = document.getElementById('notifIcon');
            const notifTitle = document.getElementById('notifTitle');
            const notifMessage = document.getElementById('notifMessage');
            
            notif.classList.remove('hidden');
            
            if (type === 'success') {
                icon.innerHTML = '<div class="w-8 h-8 bg-emerald-100 rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="check" class="w-5 h-5 text-emerald-600"></i></div>';
                notif.querySelector('.border-l-4').classList.add('border-emerald-500');
            } else {
                icon.innerHTML = '<div class="w-8 h-8 bg-rose-100 rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="x" class="w-5 h-5 text-rose-600"></i></div>';
                notif.querySelector('.border-l-4').classList.add('border-rose-500');
            }
            
            notifTitle.textContent = title;
            notifMessage.innerHTML = message;
            lucide.createIcons();
            
            setTimeout(() => {
                closeNotification();
            }, 5000);
        }

        function closeNotification() {
            document.getElementById('notification').classList.add('hidden');
        }

        function showLoading(elementId) {
            document.getElementById(elementId).classList.remove('hidden');
        }

        function hideLoading(elementId) {
            document.getElementById(elementId).classList.add('hidden');
        }
    </script>
</body>
</html>
